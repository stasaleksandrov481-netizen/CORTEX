name: CORTEX Android APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cortex-android-release
  cancel-in-progress: false

jobs:
  android:
    name: Build CORTEX with Island
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare download
        id: apk
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          name="CORTEX-$version-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-${{ steps.apk.outputs.version }}-debug-APK
          path: release/
          if-no-files-found: error

      - name: Publish version with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CORTEX ${{ steps.apk.outputs.version }}
          files: |
            release/${{ steps.apk.outputs.name }}
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true

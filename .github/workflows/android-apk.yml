name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build and verify APK
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CORTEX-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify CORTEX-debug.apk

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: CORTEX-debug.apk
          archive: false
          if-no-files-found: error

      - name: Add download link
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Скачать CORTEX-debug.apk](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

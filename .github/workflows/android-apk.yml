name: CORTEX 0.8.8 Android APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cortex-0-8-8-release
  cancel-in-progress: false

jobs:
  android:
    name: Build CORTEX with Island
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare download
        run: |
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/CORTEX-0.8.8-Island-debug.apk
          sha256sum release/CORTEX-0.8.8-Island-debug.apk > release/SHA256SUMS.txt

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-0.8.8-Island-debug-APK
          path: release/
          if-no-files-found: error

      - name: Publish v0.8.8 release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.8
          target_commitish: ${{ github.sha }}
          name: CORTEX 0.8.8 — Island
          body_path: RELEASE_NOTES_0.8.8.md
          files: |
            release/CORTEX-0.8.8-Island-debug.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://openrouter.ai; form-action 'none'; base-uri 'none'">
  <title>CORTEX</title>
  <link rel="icon" href="art/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="icons.js"></script>
  <script defer src="model.js"></script>
  <script defer src="openrouter.js"></script>
  <script defer src="wave.js"></script>
  <script defer src="screens.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app-shell" id="app" aria-label="CORTEX">
    <div id="screen" class="screen"></div>
    <nav id="navigation" class="navigation" aria-label="Основная навигация"></nav>
    <div id="splash" class="splash" role="status" aria-label="Загрузка CORTEX">
      <div class="splash-field wave-field" data-wave-host></div>
      <img class="splash-wordmark" src="art/wordmark.svg" alt="CORTEX">
    </div>
    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>Для работы CORTEX включите JavaScript.</noscript>
  </main>
</body>
</html>
